apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-web
  namespace: inventario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventario-web
  template:
    metadata:
      labels:
        app: inventario-web
    spec:
      containers:
        - name: inventario-web
          image: inventario-web:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80

