apiVersion: v1
kind: Service
metadata:
  name: ldap-service
  namespace: inventario
spec:
  ports:
    - protocol: TCP
      port: 636
      targetPort: 636
  type: ClusterIP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ldap-service
  namespace: inventario
subsets:
  - addresses:
      - ip: 0.0.0.0   # reemplazar con IP real de la VM AD
    ports:
      - port: 636
